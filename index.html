<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sagar Chaudhary | Mechanical CAD Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1b2733;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #0b2545, #133b63);
      color: white;
      padding: 70px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 42px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    header h2 {
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    header p {
      max-width: 850px;
      margin: auto;
      font-size: 16px;
      color: #dbe7f3;
    }

    nav {
      background: #ffffff;
      border-bottom: 1px solid #d7dee8;
      text-align: center;
      padding: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #0b2545;
      text-decoration: none;
      margin: 0 14px;
      font-weight: 600;
      font-size: 14px;
    }

    section {
      width: 96%;
      max-width: 1500px;
      margin: 40px auto;
    }

    .section-title {
      margin-bottom: 20px;
      border-left: 6px solid #0b5cad;
      padding-left: 14px;
    }

    .section-title h2 {
      font-size: 28px;
      color: #0b2545;
    }

    .section-title p {
      color: #5d6b7a;
      margin-top: 4px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 28px;
    }

    .card {
      background: white;
      border: 1px solid #d7dee8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      display: block;
      background: #eef2f7;
    }

    .card-content {
      padding: 18px 20px 22px;
    }

    .card-content h3 {
      color: #0b2545;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .card-content p {
      color: #4d5c6c;
      font-size: 15px;
    }

    .tags {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
